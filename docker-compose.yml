version: '3.8'

services:
  dice:
    container_name: dice
    build:
      context: .
      dockerfile: ./dice/Dockerfile
    volumes:
      - ./certs:/certs
    networks:
      - dice-net

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs
    ports:
      - "80:80"
    depends_on:
      - dice
      - gateway
    networks:
      - dice-net

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    volumes:
      - ./certs:/certs
    networks:
      - dice-net

networks:
  dice-net: